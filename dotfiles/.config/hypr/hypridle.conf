general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    # lock_cmd = playerctl --all-players pause && pidof hyprlock || hyprlock  # pause all system audio and avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 480                                # 8min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# listener { 
#     timeout = 480                                          # 8min.
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
# }

listener {
    timeout = 600                                 # 10min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 660                                                     # 11min
    # NOTE: hl.dsp.dpms takes a TABLE. The string form `dpms("on")` returns `ok` and
    # switches the outputs OFF -- verified live 2026-09-18 with before/after readings of
    # hyprctl monitors .dpmsStatus. Every "on" call here was that broken spelling.
    # This "off" line is left as-is only because it demonstrably produces the intended
    # result; it has not been re-tested in the table form on a working display.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'                            # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 7200                                # 120min
    on-timeout = systemctl suspend                # suspend pc
    # For a suspend hypridle requests itself, before_sleep_cmd/after_sleep_cmd above do not
    # run -- verified 2026-09-18, see
    # linux-debug/suspend-blank-screen-after-auto-suspend-2026-09-18.md. The outputs are
    # already DPMS-off by then (660s listener), so without this the machine resumes with
    # every panel dark. Revert by deleting this on-resume line.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}
