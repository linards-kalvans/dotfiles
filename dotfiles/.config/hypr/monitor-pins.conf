# Monitor layout BASELINE — DATA FILE, deliberately NOT sourced by Hyprland.
#
# Read by scripts/monitor-pin.py, which pushes these rules imperatively
# (hyprctl eval / hyprctl keyword) rather than declaratively.
#
# THIS IS THE FALLBACK, NOT THE LIVE LAYOUT. The live layout for each set of
# monitors is remembered in ~/.local/state/hypr/monitor-profiles.json and wins.
# These rules are used only for a monitor set the store has never seen, and the
# result is then learned as that set's first profile. Edit them to change what a
# brand-new dock comes up as; to change a dock you already use, just arrange it in
# nwg-displays and leave it -- or run `monitor-pin.py save`.
#
# WHY NOT SOURCED: nwg-displays applies a layout by writing monitors.conf, and
# Hyprland auto-reloads on that write. Anything pinned inside the sourced config
# is re-applied by that same reload and instantly clobbers the GUI change. Keeping
# the pins out of the config is what lets an nwg-displays override actually stick.
#
# WHEN A LAYOUT IS RESTORED (see scripts/monitor-pin.py):
#   * once at Hyprland start
#   * on every monitoradded / monitorremoved  (dock connect / disconnect)
# and it is the stored profile that is restored, falling back to the rules below.
# Between those events nwg-displays wins, and after 20s of quiet its result is
# learned. That is the intended behaviour.
#
# SYNTAX: ordinary hyprlang `monitor =` lines —
#   monitor = <output>,<mode>,<position>,<scale>[,<key>,<value>...]
# The output field must not contain a comma. `desc:` is a PREFIX match, so two
# monitors of the same model must be separated by serial.
#
# Rules for BOTH docks live here; only one is ever attached and a rule naming an
# absent output is accepted and ignored (verified: returns `ok`, nothing moves).

# Internal panel. eDP-1 is a fixed connector, so the name is stable.
#
# ONE RULE SERVES BOTH SITES and the two sites want different things, so this line
# cannot be right for both. The laptop panel cannot be keyed per dock: it is the same
# physical output with the same description everywhere, so neither the connector name
# nor `desc:` can distinguish office from home.
#
#   HOME  (2026-10-02, user request): to the RIGHT of the E2420HS, top-aligned.
#                                     3840x0 -- what this line now carries.
#   OFFICE (2026-09-21):              BELOW the two E243, roughly centred. 995x1080.
#
# The office value is NOT lost: it lives in that dock's learned profile in
# ~/.local/state/hypr/monitor-profiles.json, which is what actually gets restored. This
# line is reached only on a cold start of a monitor set the store has never seen.
# Both values are at least *usable* at the wrong site -- each shares a full edge with
# the externals rather than only a corner -- so a cold start at the office is misplaced
# but not unnavigable. Fix it there by arranging in nwg-displays and leaving it 20 s.
monitor = eDP-1,1920x1200@60.0,3840x0,1.0

# HOME — UGREEN dock, DP alt mode + MST on i915 (enumerates DP-5/DP-6, or DP-7/DP-8
# after a topology change; that renaming is why these are keyed by description).
# Left to right: P2314H, E2420HS, then the laptop panel (see the eDP-1 rule above).
monitor = desc:Dell Inc. DELL P2314H J8J314CFB2YS,1920x1080@60.0,0x0,1
monitor = desc:Dell Inc. DELL E2420HS DXG3X03,1920x1080@60.0,1920x0,1

# OFFICE — HP USB-C/A Universal Dock G2, DisplayLink (17e9:601e) on evdi
# (DVI-I-1/DVI-I-2, numbered in probe order). Same model, so the serial is load-
# bearing. Left/centre taken from the last layout arranged at that site
# (2026-09-21 08:29:58): CNK949120S left. Swap the two positions to flip them.
monitor = desc:HP Inc. HP E243 CNK949120S,1920x1080@60.0,0x0,1
monitor = desc:HP Inc. HP E243 CNK9471KDJ,1920x1080@60.0,1920x0,1

# OFFICE (second desk, 2026-10-15) — same HP dock, a DIFFERENT pair of panels:
# an E243 and an E24u G4, so neither serial above matches. Without these two lines
# the set cold-started on 2026-10-15 with only the eDP-1 rule landing; both
# externals fell to Hyprland's default append placement (5760x0 / 7680x0) and that
# row was immediately learned as the profile. Arranged in nwg-displays and pinned:
# E24u G4 left, E243 right, laptop panel below (swapped 2026-10-15 on request) (see the eDP-1 rule at the top --
# it carries the HOME value, so a cold start here still puts the panel to the
# right; fix in nwg-displays and leave it 20 s, as documented above).
monitor = desc:HP Inc. HP E243 CNC9372RJ3,1920x1080@60.0,1920x0,1
monitor = desc:HP Inc. HP E24u G4 CN412428N3,1920x1080@60.0,0x0,1
