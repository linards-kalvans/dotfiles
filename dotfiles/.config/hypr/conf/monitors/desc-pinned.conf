# Monitor layout pinned by DESCRIPTION, not by connector name.
#
# hyprlang mirror of lua/monitors_pin.lua — keep the two in sync.
#
# Why: DP-MST connector names are not stable. The dock's two Dells enumerate as
# DP-5/DP-6 on one plug and DP-7/DP-8 on the next, because MST destroys and
# recreates its connectors on every topology change. A layout pinned to DP-N
# silently stops applying the moment the names shift, and the catch-all
# `monitor=,preferred,auto,1` from conf/monitors/default.conf then places both
# externals to the RIGHT of eDP-1 instead of the left.
#
# Descriptions are stable across re-enumeration, so they are the correct key.
#
# Related: linux-debug/dock-mst-modeset-einval-2026-09-17.md
#
# nwg-displays' name-based output (conf/monitors/nwg-displays.conf -> monitors.conf)
# is still sourced from custom.conf immediately BEFORE this file, as a fallback, so
# arranging displays in that GUI still takes effect for the current connector names.
# These rules come after it and therefore win. Revert by dropping this file's
# source line from custom.conf.

# Internal panel. eDP-1 is a fixed connector, so the name is stable here.
monitor = eDP-1,1920x1200@60.0,3840x0,1.0

# Left external: Dell P2314H on the UGREEN dock (DP alt mode + MST).
monitor = desc:Dell Inc. DELL P2314H J8J314CFB2YS,1920x1080@60.0,0x0,1

# Centre external: Dell E2420HS on the same dock.
monitor = desc:Dell Inc. DELL E2420HS DXG3X03,1920x1080@60.0,1920x0,1
