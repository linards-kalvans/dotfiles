# Add your additional Hyprland configurations here
#
# This is an additional key binding
# bind = $mainMod CTRL, up, workspace, empty
#
# Example for xwayland
# xwayland {
#   force_zero_scaling = true
# }

# qt5ct environment variable
# env = QT_QPA_PLATFORMTHEME,qt5ct

# SDL version
env = SDL_VIDEODRIVER,wayland
# env = SDL_VIDEODRIVER,x11

# No Hardware Cursor
# cursor {
#     no_hardware_cursors = false
# }

# Blur for waybar
#layerrule = blur, waybar

# Uncomment in case you have issues with screensharing
# exec-once = ~/.config/hypr/scripts/xdg.sh
input {
    left_handed = true
}

# Autostart
exec-once = [workspace 3 silent] /opt/brave-bin/brave --profile-directory=Default --app-id=cifhbcnohmdccbgoicgdjpfamggdegmo --app-run-on-os-login-mode=windowed
exec-once = [workspace 3 silent] /opt/brave-bin/brave --profile-directory=Default --app-id=pkooggnaalmfkidjmlhoelhdllpphaga --app-run-on-os-login-mode=windowed
exec-once = [workspace 2 silent] brave %U
exec-once = [workspace 9 silent] zen-browser --class=zenbrowserlinards --profile /home/linards/.config/zen-linards
exec-once = /opt/pcloud/pcloud-drive.AppImage
exec-once = solaar -w hide

# Wallpaper bring-up + rotation (interval from ml4w/settings/wallpaper-automation.sh).
# Supersedes ML4W's `swww-daemon` and `wallpaper-restore.sh` entries in
# conf/autostart.conf, which race and leave the desktop black: it waits for
# swww-daemon to answer before restoring, then runs the rotation loop itself.
# ML4W's own wallpaper-automation.sh is not used -- it is a toggle keyed on a
# ~/.cache flag that survives reboot, so from an autostart entry it turns rotation
# off every other boot. Mirror of lua/autostart.lua; keep in sync.
# Revert by deleting this line.
exec-once = ~/.config/hypr/scripts/wallpaper-boot.sh

# Per-dock monitor layout memory. Restores the layout last used with the current
# set of monitors (keyed by their descriptions) at startup and on every
# monitoradded/monitorremoved -- i.e. dock connect and disconnect -- and learns the
# layout back once it has held still for 20s, so an nwg-displays change is
# remembered rather than clobbered. A monitor set it has never seen falls back to
# ~/.config/hypr/monitor-pins.conf. Store: ~/.local/state/hypr/monitor-profiles.json
# Mirror of lua/autostart.lua; keep in sync. Revert by deleting this line.
exec-once = ~/.config/hypr/scripts/monitor-pin.py watch

# Custom binds
# ML4W binds $mainMod, S to sidepad.sh --init (conf/keybindings/default.conf:77).
# The old `unbind = SUPER, s` here used a lowercase key and so never matched it.
# Correct case, then take SUPER+S for the screenshot selection action.
unbind = SUPER, S
bind = SUPER, S, exec, ~/.local/bin/screenshot.sh selection # Screenshot selection
bind = SUPER SHIFT, S, exec, ~/.local/bin/screenshot.sh selection # Screenshot selection
bind = SUPER, l, exec, ~/.config/hypr/scripts/power.sh lock # Lock screen
bind = CTRL ALT , left, movecurrentworkspacetomonitor, l # Move current window on workspace to left
bind = CTRL ALT , right, movecurrentworkspacetomonitor, r # Move current window to workspace on right
bind = CTRL ALT , down, movecurrentworkspacetomonitor, d # Move current window on workspace down
bind = CTRL ALT , right, movecurrentworkspacetomonitor, u # Move current window to workspace up


# monitor = DVI-I-2, 1920x1080, 0x0, 1
# monitor = DVI-I-1, 1920x1080, 1920x0, 1
# monitor = eDP-1, 1920x1200, 960x1080, 1

# nwg-displays, name-based. The only monitor layout in the sourced config.
# The desc:-keyed pins are deliberately NOT sourced -- they live in
# ~/.config/hypr/monitor-pins.conf and are pushed by scripts/monitor-pin.py at
# Hyprland start and on every dock connect/disconnect. A pin sourced here would be
# re-applied by the auto-reload that nwg-displays' own write triggers, clobbering
# the GUI change instantly. See the exec-once for monitor-pin.py below.
source = $HOME/.config/hypr/conf/monitors/nwg-displays.conf

general {
    gaps_in = 2
    gaps_out = 2
}

input {
    kb_layout = lv
    kb_variant = apostrophe
}

# Safety net for the blank-wake fault, see
# linux-debug/suspend-blank-screen-after-auto-suspend-2026-09-18.md.
# After a hypridle-initiated `systemctl suspend`, nothing re-issues DPMS-on, and at the
# Hyprland defaults (false) no keystroke or mouse move can get the outputs back either --
# all three panels stay dark until the dock drops.
# Set here rather than in conf/misc.conf: that is an ML4W stock module and the Lua port
# asserts its directive count against it. Mirror of the misc block in lua/custom.lua.
misc {
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}
